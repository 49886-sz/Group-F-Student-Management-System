<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student List - Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #1e3a5f;
            margin-top: 0;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #1e3a5f;
            color: white;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .active {
            background: #dcfce7;
            color: #166534;
        }

        .inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Student Management</h1>

        <p class="subtitle">
            View all registered students
        </p>

        <div class="table-wrapper">

            <table>
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Class</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>ST001</td>
                        <td>Ahmad Khan</td>
                        <td>Grade 10</td>
                        <td>
                            <span class="status active">Active</span>
                        </td>
                    </tr>

                    <tr>
                        <td>ST002</td>
                        <td>Sara Ali</td>
                        <td>Grade 11</td>
                        <td>
                            <span class="status active">Active</span>
                        </td>
                    </tr>

                    <tr>
                        <td>ST003</td>
                        <td>Mohammad Rahimi</td>
                        <td>Grade 9</td>
                        <td>
                            <span class="status inactive">Inactive</span>
                        </td>
                    </tr>

                    <tr>
                        <td>ST004</td>
                        <td>Fatima Noor</td>
                        <td>Grade 12</td>
                        <td>
                            <span class="status active">Active</span>
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>

        <div class="footer">
            Student Management System © 2026
        </div>

    </main>
<script>
  fetch("http://127.0.0.1:5000/students")
    .then(response => response.json())
    .then(data => {
      const tableBody = document.getElementById("student-table-body");
      tableBody.innerHTML = "";
      data.forEach(student => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${student.id}</td>
          <td>${student.name}</td>
          <td>${student.class}</td>
          <td>${student.status}</td>
        `;
        tableBody.appendChild(row);
      });
    })
    .catch(error => console.error("Error loading students:", error));
</script>

</body>
</html>

</body>
</html>
